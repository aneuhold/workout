<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MesoPro feature graphic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .canvas {
        position: relative;
        width: 1024px;
        height: 500px;
        background:
          radial-gradient(ellipse at 30% 50%, #10302840 0%, transparent 60%),
          radial-gradient(ellipse at 70% 50%, #103028 0%, #06120f 75%);
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 80px;
        box-sizing: border-box;
      }
      .logo {
        width: 280px;
        height: 280px;
        flex-shrink: 0;
        filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.45));
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .wordmark {
        font-weight: 800;
        font-size: 132px;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #cef0d8 0%, #2bba85 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 0;
      }
      .tagline {
        font-weight: 500;
        font-size: 30px;
        line-height: 1.25;
        color: #cef0d8cc;
        letter-spacing: -0.01em;
        margin: 0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <img class="logo" src="../../docs/officialAssets/logo-dark-square.svg" alt="MesoPro logo" />
      <div class="text">
        <h1 class="wordmark">MesoPro</h1>
        <p class="tagline">Evidence-based hypertrophy training</p>
      </div>
    </div>
  </body>
</html>
