name: 'Pull Request Actions'

on:
  pull_request:
    # Only initiate the workflow when a PR is opened, or committed to.
    branches:
      - main

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Check enableLocalOverride is not enabled
        run: |
          if grep -E "enableLocalOverride\s*=\s*true" src/util/localOverride.ts; then
            echo "::error::enableLocalOverride is set to true in src/util/localOverride.ts. Set it back to false before merging."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build the site
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: buildAndTypes
          path: |
            build/
            .svelte-kit/
          retention-days: 1

  testAndDeploy:
    name: 'Test and Deploy'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes

      - name: Run tests
        run: pnpm test

      - name: Run Linting
        run: pnpm lint

      - name: Run Svelte check
        run: pnpm check

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './build'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: '${{ github.event.pull_request.title }} Deploy Preview'
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
          github-deployment-description: 'Netlify Deploy Preview'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

  perf:
    name: 'Performance Tests'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run perf measurements
        run: pnpm test:perf
        env:
          PERF_TEST_USERNAME: ${{ secrets.PERF_TEST_USERNAME }}
          PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: scripts/perf/perfTemp/results/
          retention-days: 7

      - name: Sticky perf comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: '🚦 Perf Results'
          path: scripts/perf/perfTemp/results/pr-comment.md
