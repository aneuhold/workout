name: 'Pull Request Actions'

on:
  pull_request:
    # Only initiate the workflow when a PR is opened, or committed to.
    branches:
      - main

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Check enableLocalOverride is not enabled
        run: |
          if grep -E "enableLocalOverride\s*=\s*true" src/util/localOverride.ts; then
            echo "::error::enableLocalOverride is set to true in src/util/localOverride.ts. Set it back to false before merging."
            exit 1
          fi

      - name: Inspect pnpm store before install
        run: |
          echo "=== env ==="
          echo "PNPM_HOME=$PNPM_HOME"
          echo "pnpm store path: $(pnpm store path)"
          echo "pnpm cache dir:  $(pnpm config get cache-dir)"
          STORE_PATH="$(pnpm store path)"
          if [ ! -d "$STORE_PATH" ]; then
            echo "(store directory does not exist)"
            exit 0
          fi
          echo "=== top level ==="
          ls -la "$STORE_PATH"
          echo "=== sizes per top-level entry ==="
          du -sh "$STORE_PATH"/* "$STORE_PATH"/.[!.]* 2>/dev/null || true
          echo "=== file counts per top-level dir ==="
          for d in "$STORE_PATH"/files "$STORE_PATH"/links "$STORE_PATH"/.tmp; do
            [ -d "$d" ] && echo "$d: $(find "$d" -type f | wc -l) files, $(find "$d" -type l | wc -l) symlinks"
          done
          echo "=== sample files/ subdir (first non-empty) ==="
          find "$STORE_PATH/files" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | while read -r d; do
            count=$(find "$d" -type f | wc -l)
            if [ "$count" -gt 0 ]; then
              echo "$d: $count files"
              ls -la "$d" | head -5
              break
            fi
          done
          echo "=== sample links/ subdir ==="
          find "$STORE_PATH/links" -mindepth 1 -maxdepth 2 2>/dev/null | head -20

      - name: Install dependencies
        run: pnpm install

      - name: Inspect pnpm store after install
        run: |
          echo "=== which pnpm is actually running ==="
          which pnpm
          pnpm --version
          echo "PATH=$PATH"
          echo "=== pnpm store path now ==="
          pnpm store path
          echo "=== full pnpm config ==="
          pnpm config list
          STORE_PATH="$(pnpm store path)"
          echo "=== reported store top level ==="
          ls -la "$STORE_PATH"
          echo "=== reported store sizes ==="
          du -sh "$STORE_PATH"/* "$STORE_PATH"/.[!.]* 2>/dev/null || true
          echo "=== file counts ==="
          for d in "$STORE_PATH"/files "$STORE_PATH"/links "$STORE_PATH"/.tmp; do
            [ -d "$d" ] && echo "$d: $(find "$d" -type f | wc -l) files, $(find "$d" -type l | wc -l) symlinks"
          done
          echo "=== node_modules/.pnpm size (project virtual store) ==="
          du -sh node_modules/.pnpm 2>/dev/null || echo "(missing)"
          echo "=== other pnpm-ish dirs on disk ==="
          find /home/runner -maxdepth 5 -type d \( -name 'store' -o -name '.pnpm-store' -o -name 'pnpm' \) 2>/dev/null | head -20
          echo "=== all v11/v10 store dirs ==="
          find /home/runner -maxdepth 8 -type d \( -name 'v11' -o -name 'v10' -o -name 'v3' \) 2>/dev/null | head -20

      - name: Build the site
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: buildAndTypes
          # Without `include-hidden-files`, dot-prefixed paths like
          # `.svelte-kit/` are silently dropped from the artifact.
          include-hidden-files: true
          path: |
            build/
            .svelte-kit/
          retention-days: 1

  testAndDeploy:
    name: 'Test and Deploy'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes

      - name: Run tests
        run: pnpm test

      - name: Run Linting
        run: pnpm lint

      - name: Run Svelte check
        run: pnpm check

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './build'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: '${{ github.event.pull_request.title }} Deploy Preview'
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
          github-deployment-description: 'Netlify Deploy Preview'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

  perf:
    name: 'Performance Tests'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run perf measurements
        run: pnpm test:perf
        env:
          PERF_TEST_USERNAME: ${{ secrets.PERF_TEST_USERNAME }}
          PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: scripts/perf/perfTemp/results/
          retention-days: 7

      - name: Sticky perf comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: '🚦 Perf Results'
          path: scripts/perf/perfTemp/results/pr-comment.md
