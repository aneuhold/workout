name: 'Pull Request Actions'

on:
  pull_request:
    # Only initiate the workflow when a PR is opened, or committed to.
    branches:
      - main

# Cancel an in-progress run when a newer push supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Build the PR ref and main in parallel so the perf job can compare
      # them on the same runner.
      fail-fast: true
      matrix:
        ref: [pr, main]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref == 'main' && 'main' || github.ref }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Check enableLocalOverride is not enabled
        if: matrix.ref == 'pr'
        run: |
          if grep -E "enableLocalOverride\s*=\s*true" src/util/localOverride.ts; then
            echo "::error::enableLocalOverride is set to true in src/util/localOverride.ts. Set it back to false before merging."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build the site
        run: pnpm build
        # Source-map upload is gated on SENTRY_UPLOAD_SOURCE_MAPS in
        # vite.config.ts and is intentionally unset here. The main-branch
        # workflow is the only uploader.

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: buildAndTypes-${{ matrix.ref }}
          # Without `include-hidden-files`, dot-prefixed paths like
          # `.svelte-kit/` are silently dropped from the artifact.
          include-hidden-files: true
          path: |
            build/
            .svelte-kit/
          retention-days: 1

  testAndDeploy:
    name: 'Test and Deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm, Node.js, and install dependencies
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes-pr

      - name: Run tests
        run: pnpm test

      - name: Run Linting
        run: pnpm lint

      - name: Run Svelte check
        run: pnpm check

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v4
        with:
          publish-dir: './build'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-config-path: ./netlify.toml
          deploy-message: '${{ github.event.pull_request.title }} Deploy Preview'
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
          github-deployment-description: 'Netlify Deploy Preview'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

  # Compiles the same signed bundle the main-branch workflow uploads, so a
  # Gradle, Java, or signing failure surfaces on the PR that caused it rather
  # than on the merge that publishes the release.
  androidBuild:
    name: 'Android Build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm, Node.js, and install dependencies
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Check whether the version changed
        id: version
        run: pnpm tsx scripts/commands/emitVersionChanged.ts origin/main

      - name: Download build artifact
        if: steps.version.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes-pr

      - name: Set up Java
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bundle the signed release
        if: steps.version.outputs.changed == 'true'
        run: pnpm bundle:android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  perf:
    name: 'Performance Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm, Node.js, and install dependencies
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Download main build
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes-main
          path: perfBuilds/main

      - name: Download PR build
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes-pr
          path: perfBuilds/pr

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed perf user
        run: pnpm test:perf:seed
        env:
          PERF_TEST_USERNAME: ${{ secrets.PERF_TEST_USERNAME }}
          PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      # Measure main first, then PR. `vite preview` always serves `./build/`
      # using the manifest in `./.svelte-kit/`, so swap whichever ref is under
      # measurement into those paths between runs. Same runner across both →
      # cross-runner noise is removed from the comparison.
      - name: Stage main build
        run: |
          rm -rf build .svelte-kit
          cp -a perfBuilds/main/build .
          cp -a perfBuilds/main/.svelte-kit .

      - name: Measure main
        run: pnpm tsx scripts/commands/perf/runPerf.ts --label=main
        env:
          PERF_TEST_USERNAME: ${{ secrets.PERF_TEST_USERNAME }}
          PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      - name: Stage PR build
        run: |
          rm -rf build .svelte-kit
          cp -a perfBuilds/pr/build .
          cp -a perfBuilds/pr/.svelte-kit .

      - name: Measure PR
        run: pnpm tsx scripts/commands/perf/runPerf.ts --label=pr
        env:
          PERF_TEST_USERNAME: ${{ secrets.PERF_TEST_USERNAME }}
          PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      - name: Compare PR vs main
        run: pnpm tsx scripts/commands/perf/runPerf.ts --compare

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: scripts/commands/perf/perfTemp/results/
          retention-days: 7

      - name: Sticky perf comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: '🚦 Perf Results'
          path: scripts/commands/perf/perfTemp/results/pr-comment.md
