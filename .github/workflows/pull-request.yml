name: 'Pull Request Actions'

on:
  pull_request:
    # Only initiate the workflow when a PR is opened, or committed to.
    branches:
      - main

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    strategy:
      # Build the PR ref and main in parallel so the perf job can compare
      # them on the same runner.
      fail-fast: true
      matrix:
        ref: [pr, main]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref == 'main' && 'main' || github.ref }}

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Check enableLocalOverride is not enabled
        if: matrix.ref == 'pr'
        run: |
          if grep -E "enableLocalOverride\s*=\s*true" src/util/localOverride.ts; then
            echo "::error::enableLocalOverride is set to true in src/util/localOverride.ts. Set it back to false before merging."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Build the site
        run: pnpm build
        # Source-map upload is gated on SENTRY_UPLOAD_SOURCE_MAPS in
        # vite.config.ts and is intentionally unset here — only the
        # main-branch workflow and `pnpm publish:android:build` upload.

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: buildAndTypes-${{ matrix.ref }}
          # Without `include-hidden-files`, dot-prefixed paths like
          # `.svelte-kit/` are silently dropped from the artifact.
          include-hidden-files: true
          path: |
            build/
            .svelte-kit/
          retention-days: 1

  testAndDeploy:
    name: 'Test and Deploy'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes-pr

      - name: Run tests
        run: pnpm test

      - name: Run Linting
        run: pnpm lint

      - name: Run Svelte check
        run: pnpm check

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './build'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          netlify-config-path: ./netlify.toml
          deploy-message: '${{ github.event.pull_request.title }} Deploy Preview'
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
          github-deployment-description: 'Netlify Deploy Preview'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

  perf:
    name: 'Performance Tests'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download main build
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes-main
          path: perfBuilds/main

      - name: Download PR build
        uses: actions/download-artifact@v8
        with:
          name: buildAndTypes-pr
          path: perfBuilds/pr

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed perf user
        run: pnpm test:perf:seed
        env:
          PERF_TEST_USERNAME: ${{ secrets.PERF_TEST_USERNAME }}
          PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      # Measure main first, then PR. `vite preview` always serves `./build/`
      # using the manifest in `./.svelte-kit/`, so swap whichever ref is under
      # measurement into those paths between runs. Same runner across both →
      # cross-runner noise is removed from the comparison.
      - name: Stage main build
        run: |
          rm -rf build .svelte-kit
          cp -a perfBuilds/main/build .
          cp -a perfBuilds/main/.svelte-kit .

      - name: Measure main
        run: pnpm tsx scripts/perf/runPerf.ts --label=main
        env:
          PERF_TEST_USERNAME: ${{ secrets.PERF_TEST_USERNAME }}
          PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      - name: Stage PR build
        run: |
          rm -rf build .svelte-kit
          cp -a perfBuilds/pr/build .
          cp -a perfBuilds/pr/.svelte-kit .

      - name: Measure PR
        run: pnpm tsx scripts/perf/runPerf.ts --label=pr
        env:
          PERF_TEST_USERNAME: ${{ secrets.PERF_TEST_USERNAME }}
          PERF_TEST_PASSWORD: ${{ secrets.PERF_TEST_PASSWORD }}

      - name: Compare PR vs main
        run: pnpm tsx scripts/perf/runPerf.ts --compare

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: scripts/perf/perfTemp/results/
          retention-days: 7

      - name: Sticky perf comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: '🚦 Perf Results'
          path: scripts/perf/perfTemp/results/pr-comment.md
